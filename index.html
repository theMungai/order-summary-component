
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Order summary card</title>
</head>
<body>

    <div class="main-container">
        <div class="image">
            <img src="/images/illustration-hero.svg" alt="">
        </div>

        <div class="order-summary">
            <h2>Order Summary</h2>
            <p>You can now listen to millions of songs, audiobooks, and podcasts on any 
                device anywhere you like!
            </p>
        </div>

        <div class="annual-plan-container">
            <div class="annual-plan-details">
                <div class="music-icon">
                    <img src="/images/icon-music.svg" alt="">
                </div>

                <div class="pricing">
                    <h4>Annual Plan</h4>
                    <p>$59.99/year</p>
                </div>
            </div>

            <div class="change">
                <a href="#">Change</a>
            </div>
        </div>

        <div class="proceed-to-payment">
            <input type="button" value="Proceed to Payment">
            <h4>Cancel Order</h4>
        </div>
    </div>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/theMungai" target="_blank">the Mungai</a>.
  </div>
</body>
</html>
